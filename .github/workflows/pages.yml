name: Deploy static site to Pages

# Fixes the 15-min deploy-failure email spam: the ~15-min bot-data pushes to main each trigger a Pages deploy,
# and overlapping deploys collide at the Pages API (only one active deploy allowed) -> intermittent
# "Deploy to GitHub Pages" FAILURE -> email. The cure is to SERIALIZE deploys and let each COMPLETE (queue, never
# cancel) via the concurrency block below. (Stewart 2026-07-04 — corrected: cancel-in-progress:false, not true;
# cancelling mid-deploy was itself causing the collision failure.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# THE FIX: only one Pages deploy at a time, and let the in-flight one COMPLETE — the next push QUEUES behind it
# (GitHub keeps only the latest queued run). No mid-deploy cancel => no Pages-API collision => no failure email.
# This is exactly GitHub's official Pages-workflow concurrency pattern.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact (whole repo, served as-is — static site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # "Deployment failed, try again later." is a TRANSIENT GitHub-Pages soft-limit under the ~15-min deploy
      # cadence, NOT a real error (neither cancel-mode fixes a backend transient). Tolerate it + retry once after a
      # pause (the retry almost always succeeds, so the site still updates), and continue-on-error on BOTH attempts
      # so a transient — or even a rare double — failure NEVER fails the run => NEVER emails. A genuine Pages outage
      # instead shows up as the site going stale (the correct signal), not as 15-min email spam.
      - name: Deploy to GitHub Pages
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Pause, then retry (the transient limit clears fast)
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (retry)
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
