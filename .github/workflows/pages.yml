name: Deploy static site to Pages

# Fixes the 15-min deploy-failure email spam: the ~15-min bot-data pushes to main each trigger a Pages deploy,
# and overlapping deploys collide at the Pages API (only one active deploy allowed) -> intermittent
# "Deploy to GitHub Pages" FAILURE -> email. The cure is to SERIALIZE deploys and let each COMPLETE (queue, never
# cancel) via the concurrency block below. (Stewart 2026-07-04 — corrected: cancel-in-progress:false, not true;
# cancelling mid-deploy was itself causing the collision failure.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# THE FIX: only one Pages deploy at a time, and let the in-flight one COMPLETE — the next push QUEUES behind it
# (GitHub keeps only the latest queued run). No mid-deploy cancel => no Pages-API collision => no failure email.
# This is exactly GitHub's official Pages-workflow concurrency pattern.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact (whole repo, served as-is — static site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
